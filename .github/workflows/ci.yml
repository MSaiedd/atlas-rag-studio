name: checks
on:
  push:
    paths-ignore: ['docs/**', 'reports/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', 'reports/**', '**.md']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Install CPU model libraries for the adapter contract test
        if: matrix.python == '3.12'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[models]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=src --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U atlas -d atlas_test" --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        env:
          QDRANT__SERVICE__API_KEY: fixture-only-vector-key
        ports: ['6333:6333']
    env:
      ATLAS_TEST_DATABASE_URL: postgresql+psycopg://atlas:fixture-only-password@127.0.0.1:5432/atlas_test
      ATLAS_TEST_QDRANT_URL: http://127.0.0.1:6333
      ATLAS_TEST_QDRANT_API_KEY: fixture-only-vector-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_workspace.py -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: pip install -e '.[dev,browser]'
      - run: playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-screenshots
          path: reports/browser/
