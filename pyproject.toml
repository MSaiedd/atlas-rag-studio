[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supportpilot"
version = "0.1.0"
description = "Tool-using support workflow with approval-gated sandbox refunds"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.119,<1", "uvicorn[standard]>=0.37,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supportpilot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
